[package]
name = "samplicity"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-web-actors = "4"
actix = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
musk = { path = "../musk", features = ["rpc"] }
bip39 = "2"
secp256k1 = { version = "0.29", features = ["rand-std"] }
sha2 = "0.10"
hex = "0.4"
jsonrpc = "0.18"
env_logger = "0.11"
getrandom = "0.3"
esplora-rs = { path = "../esplora-rs" }
